services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./migrations/000001_create_balances_table.up.sql:/docker-entrypoint-initdb.d/01.sql:ro
      - ./migrations/000002_create_batches_table.up.sql:/docker-entrypoint-initdb.d/02.sql:ro
      - ./migrations/000003_create_holds_table.up.sql:/docker-entrypoint-initdb.d/03.sql:ro
      - ./migrations/000004_create_ledger_table.up.sql:/docker-entrypoint-initdb.d/04.sql:ro
      - ./migrations/000005_create_hold_batches_table.up.sql:/docker-entrypoint-initdb.d/05.sql:ro
      - ./migrations/000006_create_leaders_table.up.sql:/docker-entrypoint-initdb.d/06.sql:ro 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      DB_DSN: ${DB_DSN}
      WORKER_TTL_INTERVAL: ${WORKER_TTL_INTERVAL:-5}
      WORKER_BATCH_EXPIRY_INTERVAL: ${WORKER_BATCH_EXPIRY_INTERVAL:-5}
      WORKER_BATCH_CLEANUP_INTERVAL: ${WORKER_BATCH_CLEANUP_INTERVAL:-60}
      WORKER_HOLD_CLEANUP_INTERVAL: ${WORKER_HOLD_CLEANUP_INTERVAL:-60}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  swagger:
    image: swaggerapi/swagger-ui
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
    volumes:
      - ../api:/spec:ro
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
      - swagger
    restart: unless-stopped

volumes:
  db-data: